name: wso2_apip_sys_soap_dispatch
version: v1.0.0
description: |
  Resolves the logical SOAP operation for requests to SOAP APIs and publishes it to
  the shared policy context and analytics metadata. Resolution order: the SOAPAction
  HTTP header (SOAP 1.1), the action parameter of the Content-Type header (SOAP 1.2),
  and finally the local name of the first child element of the SOAP Body (document/
  literal dispatch). Optionally validates that the request body is a well-formed SOAP
  envelope, rejecting malformed requests (the policy engine renders the rejection as a
  SOAP Fault for SOAP APIs).

parameters:
  type: object
  additionalProperties: false
  properties:
    soapVersion:
      type: string
      enum: ["1.1", "1.2"]
      default: "1.1"
      description: SOAP protocol version declared by the API (informational).
    validateEnvelope:
      type: boolean
      default: true
      description: >
        When true, the request body is parsed and must be a well-formed SOAP envelope
        containing a Body element; malformed requests are rejected with a SOAP Fault.
        When false, the body is only parsed if the operation could not be resolved
        from the SOAPAction header or Content-Type action parameter.
    operations:
      type: array
      description: >
        Declared SOAP operations of the API. When the resolved action or body element
        matches an entry, the entry's name is used as the logical operation name.
      items:
        type: object
        properties:
          name:
            type: string
            description: Logical operation name.
          soapAction:
            type: string
            description: SOAPAction value (or Content-Type action parameter) for this operation.

systemParameters:
  type: object
  properties: {}
