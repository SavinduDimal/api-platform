# SOAP API for Step 2 testing against the local calculator SOAP backend
# (RnD/api-platform-soap-apis/soap-backend, listening on host port 3002).
#
# The backend exposes its SOAP 1.1 endpoint at /calculator/v1/soap11, so the
# gateway upstream points there. The gateway context (/calculator/v1) is
# rewritten to that upstream path on passthrough.
#
# NOTE: the gateway runs in Docker; `host.docker.internal` reaches the host
# where the backend is running (works out of the box on Docker Desktop / Mac).

apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: SoapApi
metadata:
  name: calculator-v1
spec:
  displayName: Calculator SOAP API
  version: v1.0
  context: /calculator/v1
  upstream:
    main:
      url: http://host.docker.internal:3002/calculator/v1/soap11
